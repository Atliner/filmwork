<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="2;url=https://namdarcompost.ir/#/home">
  <title>Vizosten | ویزوستن</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at 20% 40%, #241403, transparent 40%), radial-gradient(ellipse at 80% 75%, #160826, transparent 40%), #000; color: #f7c05a; font-family: system-ui, sans-serif; }
    main { text-align: center; width: min(100vw, 1000px); animation: appear .7s ease-out both; }
    img { display: block; width: 100%; height: auto; }
    .loader { width: 110px; height: 2px; margin: 24px auto; background: #3e2a12; overflow: hidden; border-radius: 8px; }
    .loader::after { content: ''; display: block; width: 45%; height: 100%; background: #ffb92f; box-shadow: 0 0 12px #ffb92f; animation: sweep 1s ease-in-out infinite alternate; }
    a { color: #e4b566; font-size: 13px; }
    @keyframes appear { from { opacity: 0; transform: translateY(12px); } }
    @keyframes sweep { to { transform: translateX(125%); } }
    @media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; } }
  </style>
</head>
<body>
  <main aria-label="ویزូستن، در حال بارگذاری">
    <img src="logo.jpg" alt="Vizosten | فیلم، سریال، هرجا">
    <div class="loader" aria-hidden="true"></div>
    <a href="https://namdarcompost.ir/#/home">ورود به ویزوستن</a>
  </main>
  <script>setTimeout(() => location.replace('https://namdarcompost.ir/#/home'), 1500);</script>
</body>
</html>
