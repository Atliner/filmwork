plugins { id 'com.android.application' }

android {
    namespace 'com.filmwork.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.filmwork.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'APP_URL', '"https://namdarcompost.ir/#/home"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release {
            // APK is installable; use a private stable keystore before publishing upgrades.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
