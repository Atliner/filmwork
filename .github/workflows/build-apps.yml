name: Build Filmwork apps

on:
  workflow_dispatch:
    inputs:
      public_app_url:
        description: Public HTTPS URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: apps/android
        env:
          FILMWORK_APP_URL: ${{ inputs.public_app_url }}
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Filmwork-Android-APK
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Configure website URL
        shell: pwsh
        env:
          FILMWORK_APP_URL: ${{ inputs.public_app_url }}
        run: |
          $u = [Uri]$env:FILMWORK_APP_URL
          if ($u.Scheme -ne "https") { throw "HTTPS URL required" }
          @{ url = $u.AbsoluteUri } | ConvertTo-Json | Set-Content apps/desktop/app-config.json
      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build installer
        working-directory: apps/desktop
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Filmwork-Windows-Installer
          path: apps/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
