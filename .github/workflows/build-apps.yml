name: Build Filmwork apps

on:
  workflow_dispatch:
    inputs:
      public_app_url:
        description: Public HTTPS site URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: apps/android
        env:
          FILMWORK_APP_URL: ${{ inputs.public_app_url }}
        run: gradle assembleRelease
      - name: Enforce 10 MiB APK limit
        shell: bash
        run: |
          apk=$(find apps/android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$apk"
          size=$(stat -c%s "$apk")
          echo "APK size: $size bytes"
          test "$size" -le 10485760
      - uses: actions/upload-artifact@v4
        with:
          name: Filmwork-Android-APK
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build compact Windows installer
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --bundles nsis
      - name: Enforce 10 MiB installer limit
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'No Windows installer was created.' }
          Write-Host "Installer size: $($installer.Length) bytes"
          if ($installer.Length -gt 10MB) { throw 'Installer exceeds the 10 MiB limit.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Filmwork-Windows-Installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
