name: Build Filmwork apps

on:
  workflow_dispatch:
    inputs:
      public_app_url:
        description: Public HTTPS site URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise native playback on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: cd apps/android && gradle connectedDebugAndroidTest
      - name: Build APKs
        working-directory: apps/android
        env:
          FILMWORK_APP_URL: ${{ inputs.public_app_url }}
        run: gradle assembleRelease
      - name: Report APK sizes
        shell: bash
        run: |
          find apps/android/app/build/outputs/apk/release -name '*.apk' -printf '%f %s bytes\n'
      - uses: actions/upload-artifact@v4
        with:
          name: Vizosten-Android-ARM64
          path: apps/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Vizosten-Android-ARM32
          path: apps/android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Vizosten-Android-x86_64
          path: apps/android/app/build/outputs/apk/release/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Vizosten-Android-x86
          path: apps/android/app/build/outputs/apk/release/app-x86-release.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Prepare bundled mpv runtime
        shell: pwsh
        run: ./apps/desktop/prepare-mpv.ps1
      - name: Build Windows installer
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --bundles nsis
      - name: Report Windows installer size
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'No Windows installer was created.' }
          Write-Host "Installer size: $($installer.Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: Filmwork-Windows-Installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
